name: E2E (Verboo Code)

# Run the built profile against the public Verboo Code Router. The live test
# uses a dedicated Verboo Code API key and the shared Router model patch.
#
# GitHub withholds repository secrets from pull requests from other repositories
# and Dependabot PRs. Compare repository identity because Verboo Code is itself
# an upstream fork, including on its own branches. The job-level guard
# skips untrusted PRs. The Dependabot test keys on the PR AUTHOR (pull_request.user.login), not
# github.actor (the run trigger) — a maintainer reopening a Dependabot PR would
# make github.actor human while the PR is still keyless. When the job runs, the
# secret is expected, so the preflight hard-fails if it's missing (a missing
# secret would otherwise make the self-skipping suite report a false green). A
# job skipped by a job-level `if:` reports as a SUCCESSFUL check, so this
# workflow is safe to use as a required status check if desired.
#
# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# checks out and runs the PR's HEAD code WITHOUT secrets for forks, which is what
# keeps an untrusted fork from exfiltrating the key. `pull_request_target` runs
# in the BASE repo's context WITH secrets while still able to check out untrusted
# fork code — a textbook key-leak vector, especially once this repo is public.
# The fork/secret model and its public-repo implications are recorded in
# .agents/notes/implemented/testing/2026-06-19-real-api-e2e-ci.md.
#
# Note: scheduled triggers are auto-disabled after 60 days of repo inactivity;
# push/pull_request/workflow_dispatch act as backstops.
on:
  workflow_dispatch:
    inputs:
      probe_qwen_flash:
        description: Check the existing CI identity's exact Qwen Flash route
        type: boolean
        default: false
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 00:17 UTC nightly = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 0 * * *'

# Keep only the newest validation in each workflow/ref, including master
# pushes, nightly runs, and manual dispatches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  qwen-flash-route:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_qwen_flash
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe the public Verboo Code Router
        env:
          VERBOO_CODE_CI_API_KEY: ${{ secrets.VERBOO_CODE_CI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const model = 'qwen3.8-flash'
          const key = process.env.VERBOO_CODE_CI_API_KEY?.trim()
          if (!key) throw new Error('Missing Verboo Code CI identity')
          const endpoint = 'https://code.verboo.ai/router/v1'
          const headers = { authorization: `Bearer ${key}`, 'content-type': 'application/json' }
          const catalog = await fetch(`${endpoint}/models`, {
            headers, redirect: 'error', signal: AbortSignal.timeout(10_000),
          })
          if (!catalog.ok) throw new Error(`Verboo Code catalog returned HTTP ${catalog.status}`)
          const available = await catalog.json()
          if (!Array.isArray(available.data) || !available.data.some(entry => entry.id === model)) {
            throw new Error('The Verboo Code CI identity has no route for qwen3.8-flash')
          }
          const response = await fetch(`${endpoint}/chat/completions`, {
            method: 'POST', headers, redirect: 'error', signal: AbortSignal.timeout(30_000),
            body: JSON.stringify({
              model, stream: false, max_tokens: 768, temperature: 0,
              messages: [{ role: 'user', content: 'Respond with OK.' }],
            }),
          })
          console.log(`Verboo Code route returned HTTP ${response.status}`)
          if (!response.ok) throw new Error('The authenticated Qwen Flash call failed')
          const result = await response.json()
          const choice = result.choices?.[0]
          if (!choice?.finish_reason || !(result.usage?.completion_tokens > 0)) {
            throw new Error('The Router did not return a completed response with measured usage')
          }
          console.log('Authenticated qwen3.8-flash response and usage verified.')
          NODE

  e2e:
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith'
          && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    name: e2e
    # Run on every trusted event. Skip untrusted PRs (forks + Dependabot) where
    # the secret is withheld — they would otherwise hard-fail the preflight.
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.probe_qwen_flash)
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.user.login != 'dependabot[bot]'))
    # Profile e2e files can each own several complete dsh subprocess trees, so
    # four file workers preserve process/PTY headroom. Tests retain 120s/test
    # and retry 2; 45m still bounds retry storms against a slow API.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Prepare
      # bwrap so trusted CI exercises it; the functional probe remains the
      # authority on whether the runner can use the sandbox.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Guard against a false green: the e2e suites self-skip when the key is
      # absent, so a missing/misconfigured secret would otherwise pass as
      # "all skipped". This job only runs on trusted events (the `if:` above
      # excludes keyless PRs), so the secret MUST be present — fail loudly if not.
      - name: Preflight (authenticate to Verboo Code)
        env:
          VERBOO_CODE_CI_API_KEY: ${{ secrets.VERBOO_CODE_CI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.VERBOO_CODE_CI_API_KEY?.trim()
          if (!key) throw new Error('Configure the GitHub secret VERBOO_CODE_CI_API_KEY')
          const response = await fetch('https://code.verboo.ai/router/v1/models', {
            headers: { authorization: `Bearer ${key}` }, redirect: 'error', signal: AbortSignal.timeout(10_000),
          })
          if (!response.ok) throw new Error(`Verboo Code model catalog returned HTTP ${response.status}`)
          const catalog = await response.json()
          if (!Array.isArray(catalog.data) || !catalog.data.some(model => model.id === 'qwen3.8-27b')) {
            throw new Error('The Verboo Code CI identity cannot access the integration model')
          }
          console.log('Authenticated Verboo Code model catalog verified.')
          NODE

      # The e2e suites boot the example bins in `lib` mode (DSH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        run: ${{ github.event_name == 'pull_request' && 'pnpm run build:artifacts --profile official' || 'pnpm run build:official' }}

      - name: Prepare Office runtime
        run: pnpm run prepare:primary-runtime --target linux-x64 --output .cache/e2e-office

      - name: E2E profiles without provider credentials
        env:
          DSH_PRIMARY_RUNTIME: ${{ github.workspace }}/.cache/e2e-office/primary-runtime
          DSH_E2E_MAX_WORKERS: 6
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e

      - name: E2E tests (authenticated Verboo Code Router)
        env:
          VERBOO_CODE_CI_API_KEY: ${{ secrets.VERBOO_CODE_CI_API_KEY }}
          DSH_PRIMARY_RUNTIME: ${{ github.workspace }}/.cache/e2e-office/primary-runtime
          DSH_EXAMPLE_MODE: lib
        run: pnpm exec vitest run --config vitest.e2e.config.ts apps/cli/tests/profiles/sdk/office-cli.e2e.ts
