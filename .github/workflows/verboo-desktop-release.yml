name: Diagnose Verboo Code Linux installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verboo-desktop-linux-diagnostic
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b37024ce608c8ce70177a1bfab5622a82186320
      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> ../.desktop-build/tauri/target
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev build-essential \
            pkg-config squashfs-tools desktop-file-utils libfuse2 musl-tools
      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build the product
        run: pnpm run build:artifacts
      - name: Build all platform system binaries for distribution
        if: runner.os != 'Windows'
        run: pnpm --dir native/system run build:native
      - name: Check the built contracts
        run: pnpm run build:check
      - name: Test desktop lifecycle
        run: node --test apps/desktop/tauri/tests/bridge.test.mjs apps/desktop/tauri/tests/host.test.mjs apps/desktop/tauri/tests/release.test.mjs apps/desktop/tauri/tests/pack-runtime.test.mjs
      - name: Prepare native test resources
        run: pnpm --filter @deepseek-ai/dsh-desktop run prepare:tauri
      - name: Test native process ownership
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Package the desktop runtime and installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm run build:desktop --skip-build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect installer artifacts
        env:
          RELEASE_LABEL: ${{ matrix.label }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: >-
          node --input-type=module -e "import { execFileSync } from 'node:child_process';
          process.env.GITHUB_SHA = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (process.env.GITHUB_SHA !== '4b37024ce608c8ce70177a1bfab5622a82186320') throw Error('Unexpected diagnostic source');
          await import('./apps/desktop/tauri/collect-release.mjs')"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: apps/desktop/.desktop-build/tauri/release-assets/*
          if-no-files-found: error
          retention-days: 14
