name: Verify Windows quiet updater (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> ../.desktop-build/tauri/target
          key: x86_64-pc-windows-msvc-windows-latest
      - name: Verify signed upgrade and relaunch with the native Windows installer
        shell: pwsh
        run: node apps/desktop/tauri/tests/fixtures/windows-quiet-updater-native.mjs
