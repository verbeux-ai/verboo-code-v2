name: Teste privado Verboo memoria

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - name: Preparar rascunho de teste existente
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          release_id=447721605
          draft=$(gh api "repos/${REPOSITORY}/releases/${release_id}" --jq '.draft')
          if [ "$draft" != true ]; then echo 'A release de teste nao esta em rascunho.' >&2; exit 1; fi
          gh api --method PATCH "repos/${REPOSITORY}/releases/${release_id}" -f target_commitish="$SOURCE_SHA" --jq '.id' >/dev/null
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "tag=beta-memoria-teste-interno-20261116" >> "$GITHUB_OUTPUT"
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            label: Linux
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            label: Windows
            directory: 'D:\v'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ${{ matrix.directory || github.workspace }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Usar caminho curto no Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if (Test-Path 'D:\v') { throw 'Diretorio de build ja existe' }
          git clone --no-hardlinks $env:GITHUB_WORKSPACE 'D:\v'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C 'D:\v' checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - name: Aplicar codigo de teste privado
        shell: bash
        env:
          BETA_PAYLOAD: ${{ secrets.VERBOO_MEM_BETA_PAYLOAD_7C9E51 }}
        run: |
          set -eu
          node -e 'const fs=require("fs"), c=require("crypto"); const b=Buffer.from(process.env.BETA_PAYLOAD||"", "base64"); if(c.createHash("sha256").update(b).digest("hex")!=="40b2ff69fd218a0c36b0dba4d7cd965f394b0fef9cfaf4692119bee2cfeb61c2")throw Error("Payload de teste ausente ou invalido"); fs.writeFileSync("beta-private.tar.gz",b)'
          tar -xzf beta-private.tar.gz
          git apply --check beta.patch
          git apply beta.patch
          node -e 'const f=require("fs"); f.unlinkSync("beta-private.tar.gz"); f.unlinkSync("beta.patch")'
      - name: Dependencias Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev build-essential pkg-config squashfs-tools desktop-file-utils libfuse2 musl-tools
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Compilar produto
        run: pnpm run build:artifacts
      - name: Compilar dependencias nativas Linux
        if: runner.os == 'Linux'
        run: pnpm --dir native/system run build:native
      - name: Verificar tipos
        run: pnpm run build:check
      - name: Testar ponte de memoria
        run: node --test packages/bundle/verboo-app/share/tests/*.mjs
      - name: Testar ciclo de vida do aplicativo
        run: node --test apps/desktop/tauri/tests/bridge.test.mjs apps/desktop/tauri/tests/host.test.mjs
      - name: Gerar instaladores sem publicar update
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: pnpm run build:desktop --skip-build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Enviar exclusivamente para o rascunho
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          shopt -s nullglob
          if [ "$LABEL" = Windows ]; then
            files=(apps/desktop/.desktop-build/tauri/target/$TARGET/release/bundle/nsis/*.exe)
          else
            files=(apps/desktop/.desktop-build/tauri/target/$TARGET/release/bundle/appimage/*.AppImage apps/desktop/.desktop-build/tauri/target/$TARGET/release/bundle/deb/*.deb)
          fi
          if [ ${#files[@]} -eq 0 ]; then echo 'Nenhum instalador foi gerado.' >&2; exit 1; fi
          draft=$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq '.draft')
          if [ "$draft" != true ]; then echo 'Release nao esta em rascunho.' >&2; exit 1; fi
          for file in "${files[@]}"; do
            name=$(basename "$file")
            encoded=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$name")
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            received=$(gh api --method POST -H 'Content-Type: application/octet-stream' "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${encoded}" --input "$file" --jq '.digest')
            if [ "$received" != "$expected" ]; then echo "Digest nao confere: $name" >&2; exit 1; fi
            echo "Instalador verificado: $name"
          done
