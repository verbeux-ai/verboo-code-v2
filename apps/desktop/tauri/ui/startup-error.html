<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verboo Code</title>
    <style>
      @font-face { font-family:Nunito; src:url('fonts/nunito-latin-variable.woff2') format('woff2'); font-weight:200 1000; }
      :root { color-scheme:dark; font-family:Nunito,system-ui,sans-serif; background:#111113; color:#f4f1f7; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; }
      main { width:min(420px,calc(100vw - 48px)); text-align:center; padding:32px 0; }
      img { width:104px; height:104px; filter:drop-shadow(0 0 26px #a42afd38); }
      h1 { margin:22px 0 9px; font-size:22px; } p { color:#b6aebb; line-height:1.55; margin:0 auto 20px; }
      button { border:0; border-radius:9px; background:#a829fa; color:white; font-weight:700; padding:11px 17px; cursor:pointer; }
      button:disabled { opacity:.5; cursor:default; } button:focus-visible,summary:focus-visible { outline:2px solid #d5a0ff; outline-offset:4px; }
      details { margin:20px auto 0; text-align:left; color:#d8b7ed; font-size:14px; }
      summary { display:flex; align-items:center; gap:8px; width:fit-content; max-width:100%; margin-inline:auto; cursor:pointer; list-style:none; }
      summary::-webkit-details-marker { display:none; }
      .disclosure-icon { display:grid; place-items:center; width:14px; height:14px; flex:none; transition:transform .16s ease; }
      .disclosure-icon::before { content:''; width:5px; height:5px; border:solid currentColor; border-width:0 1.5px 1.5px 0; transform:translateX(-1px) rotate(-45deg); }
      details[open] > summary .disclosure-icon { transform:rotate(90deg); }
      @media (prefers-reduced-motion:reduce) { .disclosure-icon { transition:none; } }
      details p { margin:12px 0 0; padding:14px; border:1px solid #504158; border-radius:10px; color:#c6bdca; }
      code { color:#c6bdca; overflow-wrap:anywhere; } [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <main role="alert">
      <img src="boo-triste.svg" alt="" />
      <h1 id="title"></h1>
      <p id="description"></p>
      <button id="retry" type="button"></button>
      <details id="guidance" hidden>
        <summary><span class="disclosure-icon" aria-hidden="true"></span><span id="guidance-label"></span></summary>
        <p id="guidance-text"></p>
      </details>
      <details>
        <summary><span class="disclosure-icon" aria-hidden="true"></span><span id="details-label"></span></summary>
        <p><span id="code-label"></span> <code id="code"></code><br /><span id="safe-description"></span></p>
      </details>
    </main>
    <script src="startup-error.js"></script>
  </body>
</html>
