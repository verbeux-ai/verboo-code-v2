<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verboo Code</title>
    <style>
      @font-face {
        font-family: 'Verboo Nunito';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('fonts/nunito-latin-variable.woff2') format('woff2');
      }

      :root {
        --surface: #ffffff;
        --border: #e4e4e7;
        --ink: #18181b;
        --muted: #71717a;
        --accent: #8e22d3;
        --accent-wash: rgba(142, 34, 211, 0.1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #0a0a0a;
          --border: #282828;
          --ink: #fafafa;
          --muted: #a1a1a1;
          --accent: #c078ff;
          --accent-wash: rgba(192, 120, 255, 0.14);
          color-scheme: dark;
        }
      }

      * { box-sizing: border-box; }
      html { overflow: hidden; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 22px 24px;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--border);
        font-family: 'Verboo Nunito', system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        overflow: hidden;
        user-select: none;
      }

      /* A quiet check in the brand wash, matching the app's small purple controls. */
      .mark {
        display: grid;
        place-items: center;
        flex: none;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--accent-wash);
        color: var(--accent);
      }
      .mark svg { width: 19px; height: 19px; }

      .text { display: grid; gap: 3px; min-width: 0; }
      h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); font-size: 12px; }
      .version { font-variant-numeric: tabular-nums; }

      @keyframes enter {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
      body { animation: enter 260ms cubic-bezier(0.22, 1, 0.36, 1); }
      @media (prefers-reduced-motion: reduce) { body { animation: none; } }
    </style>
  </head>
  <body data-tauri-drag-region>
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5" />
      </svg>
    </span>
    <div class="text">
      <h1 data-role="title"></h1>
      <p class="version" data-role="body"></p>
    </div>

    <script>
      const invoke = (command) => window.__TAURI_INTERNALS__.invoke(command)
      const copy = window.__VERBOO_UPDATED__
      document.querySelector('[data-role="title"]').textContent = copy.title
      document.querySelector('[data-role="body"]').textContent = copy.body
      // The notice has nothing to act on, so it leaves on its own.
      setTimeout(() => {
        invoke('update_close').catch(() => {})
      }, copy.dwellMs)
    </script>
  </body>
</html>
