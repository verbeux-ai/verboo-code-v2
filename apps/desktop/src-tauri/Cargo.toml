[package]
name = "verboo-code-desktop"
version = "0.2.2-alpha.16"
description = "Verboo Code desktop application"
edition = "2021"
rust-version = "1.97"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sys-locale = "0.3"
dunce = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
