[[permission]]
identifier = "desktop-native"
description = "Native directory selection and startup diagnostics for the owned local application window."
commands.allow = ["pick_directory", "desktop_info", "client_ready", "client_diagnostic"]

[[permission]]
identifier = "update-window"
description = "Install an offered update and dismiss its window; granted only to the update windows."
commands.allow = ["update_install", "update_close"]
