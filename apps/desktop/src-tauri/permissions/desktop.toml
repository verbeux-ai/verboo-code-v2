[[permission]]
identifier = "desktop-native"
description = "Native directory selection, deliberate quit, update state and startup diagnostics for the owned local application window."
commands.allow = ["pick_directory", "desktop_info", "client_ready", "desktop_layout_read", "desktop_layout_write", "client_diagnostic", "quit_after_hold", "update_snapshot", "update_restart", "update_retry"]

[[permission]]
identifier = "update-window"
description = "Install an offered update and dismiss its window; granted only to the update windows."
commands.allow = ["update_install", "update_close"]

[[permission]]
identifier = "startup-recovery"
description = "Retry a safely stopped startup from the local recovery window."
commands.allow = ["startup_retry"]
